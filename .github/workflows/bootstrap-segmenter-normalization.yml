name: Bootstrap segmenter normalization split

on:
  push:
    branches:
      - refactor/architecture-convergence
    paths:
      - .github/workflows/bootstrap-segmenter-normalization.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/architecture-convergence
          fetch-depth: 0

      - name: Split document normalization responsibility
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('PreviousPractice/Infrastructure/OcrQuestionSegmenter.cs')
          target_path = Path('PreviousPractice/Infrastructure/OcrQuestionSegmenter.Normalization.cs')
          architecture_path = Path('PreviousPractice/ARCHITECTURE.md')

          source = source_path.read_text(encoding='utf-8')
          source = source.replace(
              'public static class OcrQuestionSegmenter\n{',
              'public static partial class OcrQuestionSegmenter\n{',
              1)

          method_names = {
              'TryBuildNormalizedDocument',
              'ExpandParsedLine',
              'BuildPageLayout',
              'CountHorizontalOriginClusters',
              'LooksLikeStrongLayoutHeader',
              'OrderParsedPageLines',
              'OrderColumnRegion',
              'ShouldUseRowMajorOrder',
              'ScoreHeaderReadingOrder',
              'TryReadHeaderIndexForOrdering',
              'IsFullWidthGeometry',
              'TryNormalizeGeometry',
              'GetHorizontalMidpoint',
              'ExpandSyntheticLineBreaks',
          }

          def method_range(text: str, name: str):
              needle = name + '('
              name_pos = text.find(needle)
              if name_pos < 0:
                  raise RuntimeError(f'method not found: {name}')
              start = text.rfind('\n    private static ', 0, name_pos)
              if start < 0:
                  raise RuntimeError(f'method declaration not found: {name}')
              start += 1
              brace = text.find('{', name_pos)
              if brace < 0:
                  raise RuntimeError(f'opening brace not found: {name}')

              depth = 0
              i = brace
              in_string = False
              verbatim = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if in_string:
                      if verbatim:
                          if ch == '"' and nxt == '"':
                              i += 2
                              continue
                          if ch == '"':
                              in_string = False
                              verbatim = False
                      else:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == '"':
                              in_string = False
                      i += 1
                      continue
                  if in_char:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == "'":
                          in_char = False
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch == '@' and nxt == '"':
                      in_string = True
                      verbatim = True
                      i += 2
                      continue
                  if ch == '"':
                      in_string = True
                      i += 1
                      continue
                  if ch == "'":
                      in_char = True
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in '\r\n':
                              end += 1
                          return start, end
                  i += 1
              raise RuntimeError(f'closing brace not found: {name}')

          ranges = []
          for method_name in method_names:
              start, end = method_range(source, method_name)
              ranges.append((start, end, method_name, source[start:end].rstrip()))

          ranges.sort(key=lambda item: item[0])
          for previous, current in zip(ranges, ranges[1:]):
              if previous[1] > current[0]:
                  raise RuntimeError(f'overlapping extraction: {previous[2]} / {current[2]}')

          extracted = [item[3] for item in ranges]
          for start, end, _, _ in reversed(ranges):
              source = source[:start] + source[end:]

          while '\n\n\n' in source:
              source = source.replace('\n\n\n', '\n\n')
          source_path.write_text(source, encoding='utf-8')

          target = '''using PreviousPractice.Models;

namespace PreviousPractice.Infrastructure;

public static partial class OcrQuestionSegmenter
{
''' + '\n\n'.join(extracted) + '\n}\n'
          target_path.write_text(target, encoding='utf-8')

          architecture = architecture_path.read_text(encoding='utf-8')
          old = '''### 2. OCR 문항 분할

`OcrQuestionSegmenter`는 외부 facade를 유지하면서 내부를 다음 책임으로 나눕니다.

- document normalization
- header hypothesis 수집
'''
          new = '''### 2. OCR 문항 분할 — 진행 중

외부 `OcrQuestionSegmenter` facade와 판정 규칙은 유지합니다. 1차로 document normalization과 page/column layout 계산을 `Infrastructure/OcrQuestionSegmenter.Normalization.cs`로 물리 분리했습니다.

남은 내부 분리 대상은 다음과 같습니다.

- header hypothesis 수집
'''
          if old not in architecture:
              raise RuntimeError('ARCHITECTURE.md target section not found')
          architecture_path.write_text(architecture.replace(old, new, 1), encoding='utf-8')

      - name: Check diff
        run: |
          git diff --check
          test -f PreviousPractice/Infrastructure/OcrQuestionSegmenter.Normalization.cs
          grep -q 'public static partial class OcrQuestionSegmenter' PreviousPractice/Infrastructure/OcrQuestionSegmenter.cs
          grep -q 'TryBuildNormalizedDocument' PreviousPractice/Infrastructure/OcrQuestionSegmenter.Normalization.cs
          ! grep -q 'private static bool TryBuildNormalizedDocument' PreviousPractice/Infrastructure/OcrQuestionSegmenter.cs

      - name: Commit split and remove bootstrap workflow
        run: |
          git config user.name "doanythingK"
          git config user.email "166168110+doanythingK@users.noreply.github.com"
          git rm .github/workflows/bootstrap-segmenter-normalization.yml
          git add PreviousPractice/Infrastructure/OcrQuestionSegmenter.cs \
                  PreviousPractice/Infrastructure/OcrQuestionSegmenter.Normalization.cs \
                  PreviousPractice/ARCHITECTURE.md
          git commit -m "refactor: split OCR document normalization"
          git push origin HEAD:refactor/architecture-convergence
