name: Bootstrap architecture refactor

on:
  push:
    branches:
      - refactor/architecture-convergence
    paths:
      - .github/workflows/bootstrap-refactor.yml

permissions:
  contents: write

jobs:
  split-main-view-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/architecture-convergence
          fetch-depth: 0

      - name: Split MainViewModel into responsibility partials
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('PreviousPractice/ViewModels/MainViewModel.cs')
          text = path.read_text(encoding='utf-8')
          original = text

          declaration = 'public class MainViewModel : ViewModelBase'
          partial_declaration = 'public partial class MainViewModel : ViewModelBase'
          if declaration in text:
              text = text.replace(declaration, partial_declaration, 1)
          elif partial_declaration not in text:
              raise SystemExit('MainViewModel declaration not found')

          namespace_marker = 'namespace PreviousPractice.ViewModels;'
          namespace_index = text.find(namespace_marker)
          if namespace_index < 0:
              raise SystemExit('namespace marker not found')
          header = text[:namespace_index + len(namespace_marker)].rstrip() + '\n\n'

          groups = {
              'PreviousPractice/ViewModels/MainViewModel.Import.cs': [
                  'AddCategoryAsync',
                  'DeleteCategoryAsync',
                  'ImportAnswerMapAsync',
                  'ImportSourceFileAsync',
                  'LoadAnswerFileAsync',
                  'LoadSourceFilesFromDirectoryAsync',
                  'DeleteSourceFileAsync',
              ],
              'PreviousPractice/ViewModels/MainViewModel.Practice.cs': [
                  'StartPracticeAsync',
                  'StartWrongPracticeAsync',
                  'SubmitAnswerAsync',
                  'GoToNextQuestion',
                  'StopPracticeAsync',
                  'ReloadWrongAsync',
                  'RemoveWrongById',
              ],
              'PreviousPractice/ViewModels/MainViewModel.Diagnostics.cs': [
                  'BuildStructuralIssues',
                  'BuildExpectedQuestionMismatchSummary',
                  'BuildStructuralIssueSummary',
                  'BuildPdfAnalysisDiagnostics',
                  'BuildAnalysisSummary',
                  'BuildCandidateMismatchMessage',
                  'UpdatePdfAnalysisProgress',
                  'ClearPdfAnalysisState',
              ],
              'PreviousPractice/ViewModels/MainViewModel.Images.cs': [
                  'BuildQuestionImageSegments',
                  'BuildSharedContextImageSegments',
                  'ResolveSharedContextDefinition',
                  'TryResolveSharedContextRange',
                  'UpdateCurrentQuestionImageSlices',
              ],
          }

          def scan_to_open_brace(source: str, start: int) -> int:
              i = start
              state = 'code'
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          state = 'line_comment'; i += 2; continue
                      if c == '/' and n == '*':
                          state = 'block_comment'; i += 2; continue
                      if c == '"':
                          state = 'string'; i += 1; continue
                      if c == "'":
                          state = 'char'; i += 1; continue
                      if c == '{':
                          return i
                  elif state == 'line_comment':
                      if c == '\n': state = 'code'
                  elif state == 'block_comment':
                      if c == '*' and n == '/': state = 'code'; i += 2; continue
                  elif state == 'string':
                      if c == '\\': i += 2; continue
                      if c == '"': state = 'code'
                  elif state == 'char':
                      if c == '\\': i += 2; continue
                      if c == "'": state = 'code'
                  i += 1
              raise ValueError('opening brace not found')

          def matching_close_brace(source: str, open_index: int) -> int:
              depth = 0
              i = open_index
              state = 'code'
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          state = 'line_comment'; i += 2; continue
                      if c == '/' and n == '*':
                          state = 'block_comment'; i += 2; continue
                      if c == '"':
                          state = 'string'; i += 1; continue
                      if c == "'":
                          state = 'char'; i += 1; continue
                      if c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return i
                  elif state == 'line_comment':
                      if c == '\n': state = 'code'
                  elif state == 'block_comment':
                      if c == '*' and n == '/': state = 'code'; i += 2; continue
                  elif state == 'string':
                      if c == '\\': i += 2; continue
                      if c == '"': state = 'code'
                  elif state == 'char':
                      if c == '\\': i += 2; continue
                      if c == "'": state = 'code'
                  i += 1
              raise ValueError('closing brace not found')

          def method_spans(source: str, name: str):
              pattern = re.compile(
                  rf'(?m)^    (?:public|private|protected|internal)\s+'
                  rf'(?:(?:static|async|virtual|override|sealed|new)\s+)*'
                  rf'[^\n=;{{}}]*\b{re.escape(name)}\s*\('
              )
              spans = []
              for match in pattern.finditer(source):
                  start = match.start()
                  open_brace = scan_to_open_brace(source, match.end())
                  close_brace = matching_close_brace(source, open_brace)
                  end = close_brace + 1
                  while end < len(source) and source[end] in '\r\n':
                      end += 1
                  spans.append((start, end))
              return spans

          assigned = {}
          all_spans = []
          for output_path, method_names in groups.items():
              spans = []
              for method_name in method_names:
                  spans.extend(method_spans(text, method_name))
              spans = sorted(set(spans))
              if spans:
                  assigned[output_path] = spans
                  all_spans.extend(spans)

          if not all_spans:
              raise SystemExit('No extractable MainViewModel methods found')
          if len(set(all_spans)) != len(all_spans):
              raise SystemExit('A method span was assigned to more than one partial')

          for output_path, spans in assigned.items():
              blocks = [text[start:end].rstrip() for start, end in spans]
              content = header + 'public partial class MainViewModel\n{\n' + '\n\n'.join(blocks) + '\n}\n'
              Path(output_path).write_text(content, encoding='utf-8')
              print(f'{output_path}: moved {len(blocks)} method block(s)')

          for start, end in sorted(all_spans, reverse=True):
              text = text[:start] + text[end:]

          text = re.sub(r'\n{4,}', '\n\n\n', text)
          path.write_text(text, encoding='utf-8')

          if path.read_text(encoding='utf-8') == original:
              raise SystemExit('MainViewModel was not changed')
          PY

      - name: Remove one-shot bootstrap workflow
        shell: bash
        run: git rm .github/workflows/bootstrap-refactor.yml

      - name: Verify text diff
        shell: bash
        run: git diff --check

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split MainViewModel responsibilities"
          git push origin HEAD:refactor/architecture-convergence
