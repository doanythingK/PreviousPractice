name: Validate

on:
  push:
    branches:
      - refactor/architecture-convergence
  pull_request:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Windows MAUI workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore Windows app target
        shell: pwsh
        run: dotnet restore PreviousPractice/PreviousPractice.csproj -p:TargetFramework=net9.0-windows10.0.19041.0 -r win-x64

      - name: Build Windows target
        shell: pwsh
        run: dotnet build PreviousPractice/PreviousPractice.csproj -c Release -f net9.0-windows10.0.19041.0 -r win-x64 --no-restore

      - name: Restore regression tests
        shell: pwsh
        run: dotnet restore PreviousPractice.Tests/PreviousPractice.Tests.csproj

      - name: Run regression tests
        shell: pwsh
        run: dotnet test PreviousPractice.Tests/PreviousPractice.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
